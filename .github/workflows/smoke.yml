name: Simulation CI

on: [push, pull_request]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile and Import Verification
        run: |
          python -m compileall -q engine api *.py
          python -c "import api.main, run_sim, engine.chronicler"
      - name: Initialize Simulation
        run: |
          cp .env.example .env
          python init_sim.py --force
      - name: Runtime Health & Server Verification
        run: |
          timeout 5 python run_sim.py || [ $? -eq 124 ]
          python -m uvicorn api.main:app --port 8000 &
          sleep 4
          curl -sf http://127.0.0.1:8000/api/health
          curl -sf http://127.0.0.1:8000/api/state
      - name: 30-Year Demographic and Bounded Scarcity Verification
        run: python tests_30yr.py
