name: Smoke Test

on: [push, pull_request]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Initialize Simulation
        run: |
          cp .env.example .env
          python init_sim.py
      - name: Run 30-Day Simulation Verification
        run: |
          python -c "
          from engine.core import engine
          from engine.chronicler import record_daily_annal
          for _ in range(24 * 30):
              r = engine.tick_hour()
              assert 'error' not in r, r
              if r['cycle_completed']:
                  record_daily_annal(r['day'])
          print('✓ Smoke test passed: 30 days executed flawlessly')
          "
