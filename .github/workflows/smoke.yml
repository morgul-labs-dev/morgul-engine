name: Simulation CI

on: [push, pull_request]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Initialize Simulation
        run: |
          cp .env.example .env
          python init_sim.py
      - name: Run 10-Year Demographic Verification
        run: |
          python -c "
          from engine.core import engine
          from engine.database import get_connection
          for _ in range(24 * 365 * 10):
              r = engine.tick_hour()
              assert 'error' not in r, r
          conn = get_connection()
          living = conn.execute('SELECT COUNT(*) FROM agents WHERE is_alive = 1').fetchone()[0]
          total_deaths = conn.execute('SELECT COUNT(*) FROM agents WHERE is_alive = 0').fetchone()[0]
          infant_deaths = conn.execute('SELECT COUNT(*) FROM agents WHERE is_alive = 0 AND age <= 3.0').fetchone()[0]
          print(f'Living: {living}, Deaths: {total_deaths}, Infant Deaths: {infant_deaths}')
          assert living >= 20, f'Population collapsed: {living}'
          if total_deaths > 0:
              assert (infant_deaths / total_deaths) <= 0.35, f'Infant death ratio too high: {infant_deaths}/{total_deaths}'
          print('✓ 10-Year CI test passed')
          "
