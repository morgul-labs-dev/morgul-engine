name: Simulation CI

on: [push, pull_request]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile and Import Verification
        run: |
          python -m compileall -q engine api *.py
          python -c "import api.main, run_sim, engine.chronicler"
      - name: Initialize Simulation
        run: |
          cp .env.example .env
          python init_sim.py --force
      - name: Run Demographic and Bounded Scarcity Verification
        run: |
          python -c "
          import json
          from engine.core import engine
          from engine.chronicler import record_daily_annal
          
          births_y5_y10 = 0
          deaths_y5_y10 = 0

          for year in range(1, 11):
              prev_deaths = engine.get_conn().execute('SELECT COUNT(*) FROM agents WHERE is_alive = 0').fetchone()[0]
              prev_total = engine.get_conn().execute('SELECT COUNT(*) FROM agents').fetchone()[0]

              for day in range(1, 366):
                  for _ in range(24):
                      r = engine.tick_hour()
                      assert 'error' not in r, r
                  if year == 1 and day <= 5:
                      record_daily_annal(r['day'])

              new_deaths = engine.get_conn().execute('SELECT COUNT(*) FROM agents WHERE is_alive = 0').fetchone()[0] - prev_deaths
              new_births = engine.get_conn().execute('SELECT COUNT(*) FROM agents').fetchone()[0] - prev_total
              if year >= 5:
                  deaths_y5_y10 += new_deaths
                  births_y5_y10 += new_births

          conn = engine.get_conn()
          living = conn.execute('SELECT COUNT(*) FROM agents WHERE is_alive = 1').fetchone()[0]
          total_deaths = conn.execute('SELECT COUNT(*) FROM agents WHERE is_alive = 0').fetchone()[0]
          infant_deaths = conn.execute('SELECT COUNT(*) FROM agents WHERE is_alive = 0 AND age <= 3.0').fetchone()[0]
          
          invs = conn.execute('SELECT inventory FROM agents WHERE is_alive = 1').fetchall()
          rations = [json.loads(i[0] or '{}').get('rations', 0) for i in invs]
          max_rations = max(rations) if rations else 0

          print(f'Living: {living}, Total Deaths: {total_deaths}, Infant Deaths: {infant_deaths}, Max Rations: {max_rations}')
          assert 45 <= living <= 85, f'Population outside carrying capacity bounds (45-85): {living}'
          assert max_rations <= 100, f'Hoarding uncapped: max {max_rations}'
          assert deaths_y5_y10 > 0, f'No deaths between Years 5 and 10: {deaths_y5_y10}'
          assert births_y5_y10 > 0, f'No births between Years 5 and 10: {births_y5_y10}'
          if total_deaths > 0:
              assert (infant_deaths / total_deaths) <= 0.35, f'Infant death ratio too high: {infant_deaths}/{total_deaths}'
          print('✓ CI test passed successfully')
          "
